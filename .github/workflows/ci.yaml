
name: Sysdiag CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -v

      - name: Build Docker image
        run: docker build -t sysdiag:ci .

  publish-ecr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::286590629524:role/github-actions-app-deploy
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/linux-diagnostic-tool:$IMAGE_TAG" .
          docker push "$REGISTRY/linux-diagnostic-tool:$IMAGE_TAG"

  deploy-ec2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-and-build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::286590629524:role/github-actions-app-deploy
          aws-region: ap-south-1

      - name: Find the app server
        id: ec2
        run: |
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=devops-lab-dev-diagnostic" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$id" = "None" ]; then
            echo "No running app server found"
            exit 1
          fi
          echo "Deploying to $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Run deploy-sysdiag on the server
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.id }}
        run: |
          cid=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["/usr/local/bin/deploy-sysdiag"]' \
            --query Command.CommandId --output text)
          echo "SSM command: $cid"

          aws ssm wait command-executed --command-id "$cid" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text

          status=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          [ "$status" = "Success" ]

  deploy-ec2-docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish-ecr
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ec2-docker
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::286590629524:role/github-actions-app-deploy
          aws-region: ap-south-1

      - name: Find the app server
        id: ec2
        run: |
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=devops-lab-dev-diagnostic" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$id" = "None" ]; then
            echo "No running app server found"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Run deploy-sysdiag-docker on the server
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.id }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cid=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "docker deploy $IMAGE_TAG" \
            --parameters "{\"commands\":[\"/usr/local/bin/deploy-sysdiag-docker $IMAGE_TAG\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $cid"

          aws ssm wait command-executed --command-id "$cid" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text

          status=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          [ "$status" = "Success" ]

      - name: Record the live image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ssm put-parameter \
            --name /devops-lab-dev/sysdiag/image-tag \
            --value "$IMAGE_TAG" \
            --overwrite
