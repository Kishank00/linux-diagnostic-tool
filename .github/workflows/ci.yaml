
name: Sysdiag CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -v

      - name: Build Docker image
        run: docker build -t sysdiag:ci .

  publish-ecr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::286590629524:role/github-actions-app-deploy
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/linux-diagnostic-tool:$IMAGE_TAG" .
          docker push "$REGISTRY/linux-diagnostic-tool:$IMAGE_TAG"

  deploy-asg:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish-ecr
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-asg
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ASG_NAME: devops-lab-dev-asg
      TAG_PARAM: /devops-lab-dev/sysdiag/image-tag
      IMAGE_TAG: ${{ github.sha }}
      REFRESH_PREFS: '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200}'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::286590629524:role/github-actions-app-deploy
          aws-region: ap-south-1

      - name: Read the live image tag
        id: old
        run: |
          tag=$(aws ssm get-parameter --name "$TAG_PARAM" \
            --query Parameter.Value --output text)
          echo "Live image tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Record the new image tag
        run: |
          aws ssm put-parameter --name "$TAG_PARAM" --value "$IMAGE_TAG" --overwrite

      - name: Start the instance refresh
        id: refresh
        run: |
          id=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences "$REFRESH_PREFS" \
            --query InstanceRefreshId --output text)
          echo "Instance refresh: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for the refresh to finish
        env:
          REFRESH_ID: ${{ steps.refresh.outputs.id }}
        run: |
          for i in $(seq 1 60); do
            read -r status pct <<< "$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].[Status,PercentageComplete]' --output text)"
            echo "$(date +%H:%M:%S) $status ${pct}%"
            case "$status" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed) exit 1 ;;
            esac
            sleep 30
          done
          echo "Refresh did not finish within 30 minutes"
          exit 1

      - name: Roll back to the previous image tag
        if: failure() && steps.old.outputs.tag != ''
        env:
          OLD_TAG: ${{ steps.old.outputs.tag }}
          REFRESH_ID: ${{ steps.refresh.outputs.id }}
        run: |
          aws ssm put-parameter --name "$TAG_PARAM" --value "$OLD_TAG" --overwrite
          echo "Image tag restored to $OLD_TAG"

          # No refresh started means no server was touched
          [ -z "$REFRESH_ID" ] && exit 0

          # Stop the bad refresh, wait for it to settle, then roll every server back
          aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME" || true
          for i in $(seq 1 40); do
            status=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' --output text)
            case "$status" in
              Pending|InProgress|Cancelling) sleep 15 ;;
              *) break ;;
            esac
          done
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences "$REFRESH_PREFS"
          echo "Rollback refresh started; servers will return to $OLD_TAG"
